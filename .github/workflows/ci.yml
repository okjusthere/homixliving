name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homixliving
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d homixliving"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Build-time stand-ins only — no real services are contacted in CI.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/homixliving
      AUTH_SECRET: ci-only-secret-not-used-in-prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Seed schema into throwaway Postgres
        # Doubles as a smoke test that db:seed creates every table the app
        # expects (the schema-drift class of bug).
        run: npm run db:seed

      - name: Tests
        run: npm test

      - name: Listing email payment database integration
        run: npm run test:listing-email-payment:db

      - name: Agreement recovery database integration
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -p 5432 -U postgres homix_agreement_recovery
          pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges | psql -h localhost -p 5432 -U postgres -d homix_agreement_recovery -v ON_ERROR_STOP=1
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/homix_agreement_recovery npm run test:agreement-recovery:db

      - name: Celebration database integration
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -p 5432 -U postgres homix_celebration_test
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/homix_celebration_test npm run test:celebrations:db

      - name: Admin email database integration
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -p 5432 -U postgres homix_admin_identity_test
          pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges | psql -h localhost -p 5432 -U postgres -d homix_admin_identity_test -v ON_ERROR_STOP=1
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/homix_admin_identity_test npm run test:admin-agent-emails:db

      - name: Signing and onboarding access database integration
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -p 5432 -U postgres homix_signing_access
          pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges | psql -h localhost -p 5432 -U postgres -d homix_signing_access -v ON_ERROR_STOP=1
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/homix_signing_access npm run test:signing-access:db
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/homix_signing_access npm run test:agent-name:db
          createdb -h localhost -p 5432 -U postgres homix_identity_reconciliation
          pg_dump "$DATABASE_URL" --schema=portal --schema-only --no-owner --no-privileges | psql -h localhost -p 5432 -U postgres -d homix_identity_reconciliation -v ON_ERROR_STOP=1
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/homix_identity_reconciliation npm run test:agent-name-reconciliation:db

      - name: Onboarding administrator database integration
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -p 5432 -U postgres homix_onboarding_integration
          pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges | psql -h localhost -p 5432 -U postgres -d homix_onboarding_integration -v ON_ERROR_STOP=1
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/homix_onboarding_integration npm run test:onboarding-admin:db

      - name: Build
        run: npm run build
